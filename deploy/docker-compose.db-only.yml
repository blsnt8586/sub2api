# =============================================================================
# 仅数据库服务 - 用于本地开发
# =============================================================================
# 使用方法:
#   docker-compose -f docker-compose.db-only.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres-dev
    restart: unless-stopped
    ports:
      - "5434:5432"  # 映射到5434避免与本地PostgreSQL冲突
    volumes:
      # 必须挂父路径 /var/lib/postgresql（镜像的 VOLUME 声明就在这一级），
      # 不能挂子路径 /var/lib/postgresql/data：那样 Docker 会为父路径另建匿名
      # volume，而嵌套在其中的 bind 在 WSL2 挂起/恢复后会退化成 tmpfs，
      # 把宿主数据整个遮蔽 —— 表现为「重启后 users 表为空、登录失败」，
      # 且此后所有写入只进内存，容器一停就蒸发。PGDATA 因此放子目录 pgdata/。
      - ./postgres_data:/var/lib/postgresql:Z
    environment:
      - POSTGRES_USER=sub2api
      - POSTGRES_PASSWORD=sub2api_dev_password
      - POSTGRES_DB=sub2api
      - PGDATA=/var/lib/postgresql/pgdata
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:8-alpine
    container_name: sub2api-redis-dev
    restart: unless-stopped
    ports:
      - "6381:6379"  # 映射到6381避免与本地Redis冲突
    volumes:
      - ./redis_data:/data:Z
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec'
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
