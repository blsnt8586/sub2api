<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即梦视频生成测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 32px 16px; }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #f8fafc; }
    .card { background: #1e2130; border: 1px solid #2d3348; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea {
      width: 100%; padding: 10px 14px; background: #0f1117; border: 1px solid #2d3348;
      border-radius: 8px; color: #e2e8f0; font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
    textarea { resize: vertical; min-height: 80px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    button {
      padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover:not(:disabled) { background: #4f51e0; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .terminal {
      background: #0a0c10; border: 1px solid #1e2130; border-radius: 8px;
      padding: 16px; font-family: 'Courier New', monospace; font-size: 0.85rem;
      min-height: 160px; max-height: 320px; overflow-y: auto;
    }
    .log-info  { color: #94a3b8; }
    .log-ok    { color: #34d399; }
    .log-warn  { color: #fbbf24; }
    .log-err   { color: #f87171; }
    .log-cyan  { color: #67e8f9; }
    .progress-bar { background: #1e2130; border-radius: 999px; height: 8px; margin: 12px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #6366f1; border-radius: 999px; transition: width 0.5s ease; }
    .video-wrap { margin-top: 16px; text-align: center; }
    video { max-width: 100%; border-radius: 8px; border: 1px solid #2d3348; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-queued { background: #1e2130; color: #94a3b8; }
    .badge-progress { background: #1c1917; color: #fbbf24; }
    .badge-done { background: #064e3b; color: #34d399; }
    .badge-failed { background: #450a0a; color: #f87171; }
    .status-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎬 即梦视频生成测试</h1>

  <!-- 配置 -->
  <div class="card">
    <div class="field">
      <label>API Base URL</label>
      <input id="baseUrl" value="http://localhost:8080" placeholder="http://localhost:8080" />
    </div>
    <div class="field">
      <label>API Key（sub2api 密钥）</label>
      <input id="apiKey" type="password" placeholder="sk-..." />
    </div>
    <div class="field">
      <label>模型</label>
      <select id="model">
        <option value="seedance-2.0">seedance-2.0</option>
        <option value="seedance-2.0-fast" selected>seedance-2.0-fast</option>
        <option value="seedance-2.0-720p">seedance-2.0-720p</option>
        <option value="seedance-2.0-fast-480p">seedance-2.0-fast-480p</option>
      </select>
    </div>
    <div class="field">
      <label>提示词</label>
      <textarea id="prompt">A serene mountain landscape with a flowing river at sunset, cinematic lighting</textarea>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>时长（秒）</label>
        <input id="duration" type="number" value="5" min="4" max="15" />
      </div>
      <div class="field">
        <label>画幅比例</label>
        <select id="aspect">
          <option value="16:9" selected>16:9 横屏</option>
          <option value="9:16">9:16 竖屏</option>
          <option value="1:1">1:1 方形</option>
          <option value="21:9">21:9 超宽</option>
          <option value="3:4">3:4</option>
          <option value="4:3">4:3</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" id="submitBtn" onclick="startGeneration()">
      ▶ 开始生成
    </button>
  </div>

  <!-- 日志 -->
  <div class="card">
    <label style="margin-bottom:12px">运行日志</label>
    <div class="terminal" id="terminal">
      <span class="log-info">准备就绪，填写参数后点击"开始生成"…</span>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card" id="resultCard" style="display:none">
    <label>任务状态</label>
    <div class="status-row">
      <span id="statusBadge" class="badge badge-queued">排队中</span>
      <span id="taskIdLabel" style="font-size:0.8rem;color:#64748b;font-family:monospace"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div id="videoWrap" class="video-wrap" style="display:none">
      <video id="videoPlayer" controls></video>
      <p style="margin-top:8px;font-size:0.8rem;color:#64748b">
        <a id="videoLink" href="#" target="_blank" style="color:#6366f1">在新标签页打开视频</a>
      </p>
    </div>
  </div>
</div>

<script>
  let polling = null;

  function log(msg, cls = 'log-info') {
    const t = document.getElementById('terminal');
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    t.appendChild(line);
    t.scrollTop = t.scrollHeight;
  }

  function clearLog() {
    document.getElementById('terminal').innerHTML = '';
  }

  function setStatus(status, progress) {
    const badge = document.getElementById('statusBadge');
    const fill = document.getElementById('progressFill');
    const labels = { queued:'排队中', in_progress:'生成中', completed:'已完成', failed:'失败' };
    const classes = { queued:'badge-queued', in_progress:'badge-progress', completed:'badge-done', failed:'badge-failed' };
    badge.textContent = labels[status] || status;
    badge.className = 'badge ' + (classes[status] || 'badge-queued');
    if (progress !== undefined) fill.style.width = progress + '%';
  }

  async function startGeneration() {
    const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    const apiKey  = document.getElementById('apiKey').value.trim();
    const model   = document.getElementById('model').value;
    const prompt  = document.getElementById('prompt').value.trim();
    const duration = parseInt(document.getElementById('duration').value) || 5;
    const aspect  = document.getElementById('aspect').value;

    if (!apiKey) { alert('请先填写 API Key'); return; }
    if (!prompt)  { alert('请填写提示词'); return; }

    clearLog();
    if (polling) { clearInterval(polling); polling = null; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 生成中…';

    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('videoWrap').style.display = 'none';
    setStatus('queued', 0);

    log('提交视频任务…');
    log(`模型: ${model}  时长: ${duration}s  画幅: ${aspect}`, 'log-cyan');

    let taskId;
    try {
      const res = await fetch(`${baseUrl}/v1/videos`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, prompt, duration, aspect_ratio: aspect })
      });
      const data = await res.json();
      if (!res.ok) {
        log('提交失败: ' + JSON.stringify(data), 'log-err');
        btn.disabled = false; btn.textContent = '▶ 开始生成';
        return;
      }
      taskId = data.id || data.task_id;
      document.getElementById('taskIdLabel').textContent = 'task: ' + taskId;
      log('任务已创建，task_id: ' + taskId, 'log-ok');
      log('开始轮询状态（每 5 秒）…', 'log-info');
    } catch(e) {
      log('网络错误: ' + e.message, 'log-err');
      btn.disabled = false; btn.textContent = '▶ 开始生成';
      return;
    }

    // 轮询
    polling = setInterval(async () => {
      try {
        const res = await fetch(`${baseUrl}/v1/videos/${taskId}`, {
          headers: { 'Authorization': 'Bearer ' + apiKey }
        });
        const data = await res.json();
        const status = data.status;
        const progress = data.progress ?? 0;

        setStatus(status, progress);
        log(`状态: ${status}  进度: ${progress}%`, status === 'failed' ? 'log-err' : 'log-info');

        if (status === 'completed') {
          clearInterval(polling); polling = null;
          log('✅ 视频生成完成！', 'log-ok');
          const videoUrl = data.video_url || data.metadata?.content_url
            || `${baseUrl}/v1/videos/${taskId}/content`;
          log('视频地址: ' + videoUrl, 'log-cyan');
          const player = document.getElementById('videoPlayer');
          player.src = videoUrl;
          document.getElementById('videoLink').href = videoUrl;
          document.getElementById('videoWrap').style.display = 'block';
          btn.disabled = false; btn.textContent = '▶ 再次生成';
        } else if (status === 'failed') {
          clearInterval(polling); polling = null;
          const reason = data.error?.message || data.error_code || '未知错误';
          log('❌ 生成失败: ' + reason, 'log-err');
          btn.disabled = false; btn.textContent = '▶ 重试';
        }
      } catch(e) {
        log('轮询出错: ' + e.message, 'log-warn');
      }
    }, 5000);
  }
</script>
</body>
</html>
